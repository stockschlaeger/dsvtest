# Lokale Entwicklungsumgebung
#   Postgres: localhost:5433 (dsv / dsv), Datenbank dsv – Altschema in Schema "dsv", Tabellen der App in "dsv_app"
#   Keycloak: http://localhost:8180 (admin / admin) – nur für AUTH_MODUS=keycloak, simuliert den zentralen Keycloak
#             der Organisation; startet nur mit: docker compose --profile keycloak up -d
services:
  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-dsv.json:/opt/keycloak/data/import/realm-dsv.json:ro

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dsv
      POSTGRES_USER: dsv
      POSTGRES_PASSWORD: dsv
      # upper() wie Oracle UPPER („ß“ bleibt „ß“) – nötig für die Prüfregeln stichwort = upper(stichwort) u. a.
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8"
      TZ: Europe/Berlin
    ports:
      - "5433:5432"
    volumes:
      - postgres-daten:/var/lib/postgresql

volumes:
  postgres-daten:
